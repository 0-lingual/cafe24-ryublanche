<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryublanche AX — 상품 자동 등록</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }

  header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; }
  header span { font-size: 13px; color: #888; }

  .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  .card { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #e8e8e8; }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #444; }

  /* 업로드 존 */
  .upload-zone { border: 2px dashed #ccc; border-radius: 10px; padding: 48px 24px; text-align: center; cursor: pointer; transition: all .2s; position: relative; }
  .upload-zone:hover, .upload-zone.drag-over { border-color: #6366f1; background: #f0f0ff; }
  .upload-zone p { color: #888; font-size: 14px; margin-top: 8px; }
  .upload-zone input { display: none; }
  #preview { width: 100%; border-radius: 8px; margin-top: 16px; display: none; max-height: 360px; object-fit: contain; }

  /* 업로드 존 오버레이 (분석 중) */
  .upload-overlay { display: none; position: absolute; inset: 0; border-radius: 8px; background: rgba(99,102,241,.08); align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
  .upload-overlay.show { display: flex; }
  .upload-overlay p { font-size: 13px; color: #6366f1; font-weight: 500; }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-success:hover { background: #059669; }
  .btn-success:disabled { background: #6ee7b7; cursor: not-allowed; }
  .btn-outline { background: #fff; color: #6366f1; border: 1px solid #6366f1; }
  .btn-outline:hover { background: #eef2ff; }

  .btn-row { display: flex; gap: 8px; margin-top: 16px; }

  /* 폼 */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
  input[type=text], input[type=number], textarea, select { width: 100%; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px 12px; font-size: 14px; transition: border .15s; background: #fff; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #6366f1; }
  textarea { resize: vertical; min-height: 80px; }

  .price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* 사이즈 체크 */
  .size-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .size-chip { padding: 5px 14px; border-radius: 20px; border: 1.5px solid #e0e0e0; font-size: 13px; cursor: pointer; transition: all .15s; user-select: none; }
  .size-chip.selected { border-color: #6366f1; background: #eef2ff; color: #6366f1; font-weight: 600; }

  /* 상태 */
  .status { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-top: 12px; display: none; }
  .status.loading { background: #fef9c3; color: #854d0e; display: flex; align-items: center; gap: 8px; }
  .status.success { background: #dcfce7; color: #166534; display: block; }
  .status.error { background: #fee2e2; color: #991b1b; display: block; }

  .spinner { width: 16px; height: 16px; border: 2px solid #f59e0b; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
  .spinner-indigo { border-color: #6366f1; border-top-color: transparent; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 상품 목록 */
  .full-width { grid-column: 1 / -1; }
  .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 8px; }
  .product-card { border: 1px solid #e8e8e8; border-radius: 10px; overflow: hidden; }
  .product-card img { width: 100%; height: 180px; object-fit: cover; background: #f0f0f0; }
  .product-card .info { padding: 12px; }
  .product-card .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .product-card .price { font-size: 13px; color: #6366f1; margin-top: 2px; }
  .product-card .no { font-size: 11px; color: #aaa; margin-top: 2px; }
  .empty { text-align: center; color: #aaa; padding: 32px; font-size: 14px; }

  /* 본문 구성 */
  .body-slot { display: flex; gap: 16px; margin-bottom: 20px; align-items: flex-start; }
  .body-img-box { flex-shrink: 0; width: 180px; height: 180px; border: 2px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: border-color .2s; }
  .body-img-box:hover { border-color: #6366f1; }
  .body-img-box img { width: 100%; height: 100%; object-fit: cover; }
  .body-img-box .placeholder { color: #bbb; font-size: 12px; text-align: center; padding: 8px; pointer-events: none; }
  .body-img-box input { display: none; }
  .body-text-area { flex: 1; }
  .body-text-area textarea { width: 100%; height: 160px; resize: vertical; }

  .body-img-only-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 8px; }
  .body-img-only-box { height: 160px; border: 2px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: border-color .2s; }
  .body-img-only-box:hover { border-color: #6366f1; }
  .body-img-only-box img { width: 100%; height: 100%; object-fit: cover; }
  .body-img-only-box .placeholder { color: #bbb; font-size: 12px; text-align: center; padding: 4px; pointer-events: none; }
  .body-img-only-box input { display: none; }
  .btn-ghost { background: #f5f5f5; color: #555; border: 1px dashed #ccc; }
  .btn-ghost:hover { background: #efefef; border-color: #aaa; }
</style>
</head>
<body>

<header>
  <h1>Ryublanche AX</h1>
  <span>상품 자동 등록 어드민</span>
</header>

<div class="container">

  <!-- 왼쪽: 이미지 업로드 -->
  <div class="card">
    <h2>1. 이미지 업로드</h2>
    <div class="upload-zone" id="uploadZone">
      <svg width="40" height="40" fill="none" stroke="#bbb" stroke-width="1.5" viewBox="0 0 24 24">
        <path d="M4 16l4-4 4 4 4-6 4 6"/><rect x="3" y="3" width="18" height="18" rx="3"/>
      </svg>
      <p>클릭하거나 이미지를 드래그하세요<br><small>jpg, png, gif, webp</small></p>
      <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.webp">
      <div class="upload-overlay" id="uploadOverlay">
        <div class="spinner spinner-indigo"></div>
        <p>AI 분석 중...</p>
      </div>
    </div>
    <img id="preview" alt="미리보기">
    <div class="btn-row">
      <button class="btn btn-outline" id="resetBtn">초기화</button>
    </div>
    <div class="status" id="analyzeStatus"></div>
  </div>

  <!-- 오른쪽: 상품 정보 -->
  <div class="card">
    <h2>2. 상품 정보 확인 & 등록</h2>

    <div class="form-group">
      <label>상품명</label>
      <input type="text" id="productName" placeholder="AI 분석 후 자동 입력됩니다">
    </div>
    <div class="form-group">
      <label>한 줄 소개</label>
      <input type="text" id="simpleDesc" placeholder="간단한 상품 소개">
    </div>
    <div class="price-row">
      <div class="form-group">
        <label>판매가 (원)</label>
        <input type="number" id="price" placeholder="89000">
      </div>
      <div class="form-group">
        <label>공급가 (원)</label>
        <input type="number" id="supplyPrice" placeholder="45000">
      </div>
    </div>
    <div class="form-group">
      <label>카테고리</label>
      <select id="categorySelect">
        <option value="">로딩 중...</option>
      </select>
    </div>
    <div class="form-group">
      <label>태그</label>
      <input type="text" id="productTag" placeholder="투피스,세트,여름,데일리">
    </div>
    <div class="form-group">
      <label>사이즈</label>
      <div class="size-options" id="sizeOptions">
        <span class="size-chip" data-size="FREE">FREE</span>
        <span class="size-chip" data-size="XS">XS</span>
        <span class="size-chip" data-size="S">S</span>
        <span class="size-chip" data-size="M">M</span>
        <span class="size-chip" data-size="L">L</span>
        <span class="size-chip" data-size="XL">XL</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-success" id="createBtn" disabled>
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
        카페24에 등록
      </button>
    </div>
    <div class="status" id="createStatus"></div>
  </div>

  <!-- 본문 구성 -->
  <div class="card full-width" id="bodySection">
    <h2>3. 본문 구성</h2>

    <!-- 이미지 1~4: 이미지 + 텍스트 -->
    <div id="bodySlots"></div>

    <!-- 이미지 5~15: 이미지만 -->
    <div id="bodyExtraSection" style="margin-top:16px;">
      <label style="font-size:12px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.4px;">이미지 전용 슬롯 (5번~)</label>
      <div class="body-img-only-grid" id="bodyExtraGrid"></div>
      <button class="btn btn-ghost" id="addExtraBtn" style="margin-top:12px;font-size:13px;">+ 이미지 추가하기</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="genBodyTextBtn" disabled>✨ 본문 텍스트 자동 생성</button>
    </div>
    <div class="status" id="bodyStatus"></div>
  </div>

  <!-- 하단: 상품 목록 -->
  <div class="card full-width">
    <h2>등록된 상품 목록 <button class="btn btn-outline" id="refreshBtn" style="font-size:12px;padding:4px 12px;float:right">새로고침</button></h2>
    <div class="product-list" id="productList"><div class="empty">로딩 중...</div></div>
  </div>

</div>

<script>
let currentFilename = null;

// ── 본문 구성 ─────────────────────────────────────────────────────────────────
// bodySlots[0..3]: { filename, text } — 이미지+텍스트 슬롯 (최대 4개)
// bodyExtras[4..14]: { filename } — 이미지 전용 슬롯
const bodySlots = [null, null, null, null];   // 최대 4슬롯
const bodyExtras = [];                         // 5번 이후 (최대 11개)

function renderBodySlots() {
  const container = document.getElementById('bodySlots');
  container.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const slot = bodySlots[i];
    const div = document.createElement('div');
    div.className = 'body-slot';
    div.innerHTML = `
      <div class="body-img-box" id="bodyImgBox${i}">
        ${slot ? `<img src="/uploads/${slot.filename}" alt="">` : `<div class="placeholder">📷<br>이미지 ${i+1}<br>(클릭)</div>`}
        <input type="file" id="bodyFileInput${i}" accept=".jpg,.jpeg,.png,.gif,.webp">
      </div>
      <div class="body-text-area">
        <label style="font-size:12px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.4px;">본문 텍스트 ${i+1}</label>
        <textarea id="bodyText${i}" placeholder="이미지 업로드 후 자동 생성됩니다. 직접 수정도 가능해요.">${slot ? (slot.text || '') : ''}</textarea>
      </div>`;
    container.appendChild(div);

    document.getElementById(`bodyImgBox${i}`).addEventListener('click', () => {
      document.getElementById(`bodyFileInput${i}`).click();
    });
    document.getElementById(`bodyFileInput${i}`).addEventListener('change', e => {
      uploadBodyImage(e.target.files[0], i, false);
    });
    document.getElementById(`bodyText${i}`).addEventListener('input', e => {
      if (!bodySlots[i]) bodySlots[i] = {};
      bodySlots[i].text = e.target.value;
    });
  }
  updateGenBodyTextBtn();
}

function renderBodyExtras() {
  const grid = document.getElementById('bodyExtraGrid');
  grid.innerHTML = '';
  bodyExtras.forEach((slot, idx) => {
    const div = document.createElement('div');
    div.className = 'body-img-only-box';
    div.innerHTML = `
      ${slot ? `<img src="/uploads/${slot.filename}" alt="">` : `<div class="placeholder">📷<br>이미지 ${idx+5}</div>`}
      <input type="file" accept=".jpg,.jpeg,.png,.gif,.webp" style="display:none">`;
    grid.appendChild(div);

    div.addEventListener('click', () => div.querySelector('input').click());
    div.querySelector('input').addEventListener('change', e => {
      uploadBodyImage(e.target.files[0], idx + 4, true);
    });
  });

  // 최대 15장 (슬롯 4 + 엑스트라 11)
  const total = 4 + bodyExtras.length;
  document.getElementById('addExtraBtn').style.display = total >= 15 ? 'none' : '';
}

function updateGenBodyTextBtn() {
  const allFilled = bodySlots.every(s => s && s.filename);
  document.getElementById('genBodyTextBtn').disabled = !allFilled;
}

async function uploadBodyImage(file, slotIndex, isExtra) {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/api/body-images', { method: 'POST', body: fd });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
    const { filename } = await res.json();

    if (!isExtra) {
      bodySlots[slotIndex] = { filename, text: bodySlots[slotIndex]?.text || '' };
      renderBodySlots();
    } else {
      const extraIdx = slotIndex - 4;
      bodyExtras[extraIdx] = { filename };
      renderBodyExtras();
    }
  } catch(e) {
    alert(`이미지 업로드 실패: ${e.message}`);
  }
}

document.getElementById('addExtraBtn').addEventListener('click', () => {
  if (4 + bodyExtras.length >= 15) return;
  bodyExtras.push(null);
  renderBodyExtras();
});

document.getElementById('genBodyTextBtn').addEventListener('click', async () => {
  const btn = document.getElementById('genBodyTextBtn');
  btn.disabled = true;
  setStatus('bodyStatus', 'loading', 'Claude가 본문 텍스트를 생성하는 중... (30초 정도 소요될 수 있어요)');

  const filenames = bodySlots.filter(s => s && s.filename).map(s => s.filename);
  try {
    const res = await fetch('/api/analyze-body', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ filenames }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
    const { texts } = await res.json();

    texts.forEach((text, i) => {
      if (bodySlots[i]) bodySlots[i].text = text;
      const ta = document.getElementById(`bodyText${i}`);
      if (ta) ta.value = text;
    });
    setStatus('bodyStatus', 'success', '✅ 본문 텍스트 자동 생성 완료! 내용을 확인하고 수정하세요.');
  } catch(e) {
    setStatus('bodyStatus', 'error', `텍스트 생성 실패: ${e.message}`);
    btn.disabled = false;
  }
});

// 초기 렌더링
renderBodySlots();
renderBodyExtras();

// ── 업로드 존 ─────────────────────────────────────────────────────────────────
const zone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const overlay = document.getElementById('uploadOverlay');

zone.addEventListener('click', () => fileInput.click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

function handleFile(file) {
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  analyzeFile(file);
}

document.getElementById('resetBtn').addEventListener('click', () => {
  preview.style.display = 'none';
  preview.src = '';
  fileInput.value = '';
  currentFilename = null;
  document.getElementById('createBtn').disabled = true;
  setStatus('analyzeStatus', '', '');
  setStatus('createStatus', '', '');
  overlay.classList.remove('show');
  clearForm();
});

// ── AI 분석 (업로드 즉시 자동 실행) ──────────────────────────────────────────
async function analyzeFile(file) {
  overlay.classList.add('show');
  setStatus('analyzeStatus', 'loading', 'Claude가 이미지를 분석하는 중...');

  const fd = new FormData();
  fd.append('file', file);

  try {
    const res = await fetch('/api/analyze', { method: 'POST', body: fd });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || res.statusText); }
    const data = await res.json();

    fillForm(data);
    currentFilename = data._image_filename;
    document.getElementById('createBtn').disabled = false;
    setStatus('analyzeStatus', 'success', '분석 완료! 내용을 확인하고 수정한 뒤 등록하세요.');
  } catch (e) {
    setStatus('analyzeStatus', 'error', `분석 실패: ${e.message}`);
  } finally {
    overlay.classList.remove('show');
  }
}

function fillForm(data) {
  document.getElementById('productName').value = data.product_name || '';
  document.getElementById('simpleDesc').value = data.simple_description || '';
  document.getElementById('price').value = data.price || '';
  document.getElementById('supplyPrice').value = data.supply_price || '';
  document.getElementById('productTag').value = data.product_tag || '';

  document.querySelectorAll('.size-chip').forEach(chip => chip.classList.remove('selected'));
  (data.sizes || []).forEach(size => {
    const chip = document.querySelector(`.size-chip[data-size="${size}"]`);
    if (chip) chip.classList.add('selected');
  });
}

function clearForm() {
  ['productName','simpleDesc','price','supplyPrice','productTag'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('selected'));
}

// 사이즈 토글
document.getElementById('sizeOptions').addEventListener('click', e => {
  if (e.target.classList.contains('size-chip')) e.target.classList.toggle('selected');
});

// ── 카테고리 로드 ─────────────────────────────────────────────────────────────
async function loadCategories() {
  try {
    const res = await fetch('/api/categories');
    const data = await res.json();
    const sel = document.getElementById('categorySelect');
    const cats = data.categories || [];
    if (!cats.length) { sel.innerHTML = '<option value="">카테고리 없음</option>'; return; }
    sel.innerHTML = cats.map(c =>
      `<option value="${c.category_no}">${'　'.repeat((c.category_depth||1)-1)}${c.category_name}</option>`
    ).join('');
  } catch(e) {
    document.getElementById('categorySelect').innerHTML = '<option value="">카테고리 로드 실패</option>';
  }
}

// ── 상품 등록 ─────────────────────────────────────────────────────────────────
document.getElementById('createBtn').addEventListener('click', async () => {
  const createBtn = document.getElementById('createBtn');
  createBtn.disabled = true;
  setStatus('createStatus', 'loading', '카페24에 등록 중...');

  const sizes = [...document.querySelectorAll('.size-chip.selected')].map(c => c.dataset.size);
  const categoryNo = parseInt(document.getElementById('categorySelect').value) || 0;

  // 본문 데이터 수집
  const bodyImageFilenames = [
    ...bodySlots.filter(s => s && s.filename).map(s => s.filename),
    ...bodyExtras.filter(s => s && s.filename).map(s => s.filename),
  ];
  const bodyTexts = bodySlots.map((s, i) => {
    const ta = document.getElementById(`bodyText${i}`);
    return ta ? ta.value : (s?.text || '');
  });

  const body = {
    product_name: document.getElementById('productName').value,
    supply_product_name: document.getElementById('productName').value,
    price: document.getElementById('price').value,
    supply_price: document.getElementById('supplyPrice').value,
    simple_description: document.getElementById('simpleDesc').value,
    product_tag: document.getElementById('productTag').value,
    image_filename: currentFilename || '',
    sizes,
    category_no: categoryNo,
    body_image_filenames: bodyImageFilenames,
    body_texts: bodyTexts,
  };

  try {
    const res = await fetch('/api/products', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok) { const e = await res.json(); throw new Error(JSON.stringify(e.detail || e)); }
    const data = await res.json();

    const shopLink = data.shop_url
      ? ` <a href="${data.shop_url}" target="_blank" style="color:#166534;font-weight:600;text-decoration:underline">쇼핑몰에서 보기 →</a>`
      : '';
    const imgNote = data.image_uploaded
      ? '<br><small style="color:#444">✅ 이미지도 자동 등록됨</small>'
      : '<br><small style="color:#888">⚠️ 이미지 자동 등록은 서버 시작 후 약 10초 후 활성화됩니다.</small>';
    setStatus('createStatus', 'success', `${data.message} — 코드: ${data.product_code}${shopLink}${imgNote}`);
    loadProducts();
  } catch (e) {
    setStatus('createStatus', 'error', `등록 실패: ${e.message}`);
    createBtn.disabled = false;
  }
});

// ── 상품 목록 ─────────────────────────────────────────────────────────────────
async function loadProducts() {
  try {
    const res = await fetch('/api/products?limit=12');
    const data = await res.json();
    const list = document.getElementById('productList');
    const products = data.products || [];
    if (!products.length) { list.innerHTML = '<div class="empty">등록된 상품이 없습니다.</div>'; return; }
    list.innerHTML = products.map(p => `
      <div class="product-card">
        ${p.detail_image ? `<img src="${p.detail_image}" alt="${p.product_name}" onerror="this.style.display='none'">` : '<div style="height:180px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px">이미지 없음</div>'}
        <div class="info">
          <div class="name" title="${p.product_name}">${p.product_name}</div>
          <div class="price">${Number(p.price).toLocaleString()}원</div>
          <div class="no">No.${p.product_no}</div>
        </div>
      </div>`).join('');
  } catch(e) {
    document.getElementById('productList').innerHTML = '<div class="empty">목록 로드 실패</div>';
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadProducts);

// ── 유틸 ──────────────────────────────────────────────────────────────────────
function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.innerHTML = type === 'loading'
    ? `<div class="spinner"></div><span>${msg}</span>`
    : msg;
  el.style.display = type ? '' : 'none';
}

// 초기 로드
loadCategories();
loadProducts();
</script>
</body>
</html>
